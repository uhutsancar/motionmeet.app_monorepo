# Example scrape configuration (WP-20 of the 2026-11 audit; Ek B-6).
# Scrape the private ops port (METRICS_PORT, 9464) of every backend process on
# the internal network only. Never route it through the public proxy.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.example.yml

scrape_configs:
  - job_name: motionmeet
    metrics_path: /metrics
    static_configs:
      # One target per process; the `role` label (api/worker/scheduler) comes
      # from the process itself. Replace with service discovery in a real
      # deployment.
      - targets: ["backend:9464", "worker:9464", "scheduler:9464"]
