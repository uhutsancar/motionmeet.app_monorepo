services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: motionmeet_backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
    networks:
      - motionmeet_net

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        - VITE_BASEURL=http://localhost:8081
        - VITE_SOCKET_URL=ws://localhost:8081
    container_name: motionmeet_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - motionmeet_net

networks:
  motionmeet_net:
    driver: bridge
