name: motionmeet_dev

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motionmeetdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motionmeet-development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_dev_data:/data
    networks:
      - data

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-motionmeet-development}@postgres:5432/${POSTGRES_DB:-motionmeetdb}
      DATABASE_POOL_MIN: 0
      DATABASE_POOL_MAX: 10
      REDIS_URL: redis://redis:6379
      JWT_SECRET: development-only-change-before-deployment
      FRONTEND_URL: http://localhost:${WEB_PORT:-5173}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
      MEDIA_UPLOADS_ENABLED: "false"
      EMAIL_ENABLED: "false"
      RUN_SCHEDULED_JOBS: "false"
      RUN_MIGRATIONS: "true"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ./packages/backend:/app/packages/backend
      - ./packages/shared:/app/packages/shared
      - backend_ts_node_modules:/app/packages/backend/node_modules
    networks:
      - edge
      - data

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.dev
    environment:
      VITE_BASEURL: http://localhost:${BACKEND_PORT:-4000}
      VITE_SOCKET_URL: http://localhost:${BACKEND_PORT:-4000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./packages/web:/app/packages/web
      - ./packages/shared:/app/packages/shared
      - web_ts_node_modules:/app/packages/web/node_modules
    networks:
      - edge

  mobile:
    profiles: ["mobile"]
    build:
      context: .
      dockerfile: packages/mobile/Dockerfile.dev
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:4000}
      EXPO_PUBLIC_WEB_URL: ${EXPO_PUBLIC_WEB_URL:-http://localhost:5173}
      EXPO_NO_TELEMETRY: "1"
    ports:
      - "${EXPO_PORT:-8081}:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./packages/mobile:/app/packages/mobile
      - ./packages/shared:/app/packages/shared
      - mobile_ts_node_modules:/app/packages/mobile/node_modules
    networks:
      - edge

networks:
  edge:
  data:

volumes:
  postgres_dev_data:
  redis_dev_data:
  backend_ts_node_modules:
  web_ts_node_modules:
  mobile_ts_node_modules:
