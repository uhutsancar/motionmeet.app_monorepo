<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MotionMeet">
  <title>MotionMeet</title>
  <defs>
    <linearGradient id="mmTile" x1="40" y1="0" x2="472" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141C2E"/>
      <stop offset=".5" stop-color="#0D1424"/>
      <stop offset="1" stop-color="#070B15"/>
    </linearGradient>
    <linearGradient id="mmStroke" x1="96" y1="128" x2="416" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset=".55" stop-color="#2FA9F4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!--
    The tile is near-black rather than coloured, because the mark itself is the
    colour. On a launcher full of saturated squares a dark plate with one bright
    letter is what makes it findable, and it is the same surface the logo sits
    on inside the app, so the icon and the header read as one thing.
  -->
  <rect width="512" height="512" rx="116" fill="url(#mmTile)"/>

  <path d="M112 380V166l144 138 144-138v214"
        fill="none"
        stroke="url(#mmStroke)"
        stroke-width="62"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
