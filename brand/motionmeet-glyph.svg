<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MotionMeet">
  <title>MotionMeet</title>
  <defs>
    <linearGradient id="mmgStroke" x1="96" y1="128" x2="416" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset=".55" stop-color="#2FA9F4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!--
    The mark is a single unbroken stroke that draws an M and, read again, two
    strides: down, up, down, up. Round caps and joins keep it moving rather than
    sitting still, and the one diagonal gradient carries the eye left to right
    across the whole letter instead of colouring each limb separately.
  -->
  <path d="M112 380V166l144 138 144-138v214"
        fill="none"
        stroke="url(#mmgStroke)"
        stroke-width="62"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
