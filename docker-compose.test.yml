name: motionmeet_test

services:
  postgres-test:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: motionmeet_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: motionmeet-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motionmeet_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  # Disposable broker for tests/integration/rabbitmq.test.ts; nothing is kept.
  rabbitmq-test:
    image: rabbitmq:4.2-alpine
    ports:
      - "${RABBITMQ_TEST_PORT:-5673}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: motionmeet
      RABBITMQ_DEFAULT_PASS: motionmeet-test
    healthcheck:
      # A plain port probe. rabbitmq-diagnostics starts an Erlang VM per check
      # and, run as root before the broker is up, creates .erlang.cookie with
      # an owner the broker cannot read, so the first boot fails with eacces.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672"]
      interval: 3s
      timeout: 10s
      retries: 40
    tmpfs:
      - /var/lib/rabbitmq

  # Disposable cache for tests/integration/feedPrivacy.test.ts.
  redis-test:
    image: redis:8-alpine
    ports:
      - "${REDIS_TEST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
