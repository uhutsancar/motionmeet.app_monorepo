name: motionmeet_test

services:
  postgres-test:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: motionmeet_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: motionmeet-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motionmeet_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
