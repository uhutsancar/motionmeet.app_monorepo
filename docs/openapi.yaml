openapi: 3.1.0
info:
  title: MotionMeet API
  version: 1.0.0
  description: Contract shared by the web, Expo mobile, and Express API packages.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Account authentication and session lifecycle.
  - name: User
    description: Account profiles, privacy, discovery and relationships.
  - name: Media
    description: Direct object-storage upload authorization.
  - name: Social
    description: Feed posts, comments and stories.
  - name: Workouts
    description: Workout logging and server-derived performance metrics.
  - name: Messages
    description: Private conversations and message state.
  - name: Exercises
    description: Exercise catalog, details and personal records.
  - name: Routines
    description: Reusable workout routines.
  - name: Reference
    description: Public and authenticated reference catalogs.
  - name: Admin
    description: Superadmin-only account management.
  - name: Health
    description: Container and dependency health probes.
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      operationId: postAuthRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate an account
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 72 }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate an authentication session
      operationId: postAuthRefresh
      security: []
      description: "Web uses the HttpOnly refresh cookie. Mobile sends refreshToken and X-Client-Platform: mobile."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Rotated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End an authentication session
      operationId: postAuthLogout
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset
      operationId: postAuthForgotPassword
      security: []
      description: Always returns an accepted response so account existence is not disclosed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202":
          $ref: "#/components/responses/Success"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset an account password
      operationId: postAuthResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 32, maxLength: 256 }
                password: { type: string, minLength: 10, maxLength: 72 }
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated account
      operationId: getAuthMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [success, user]
                properties:
                  success: { const: true }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/user/privacy:
    get:
      tags: [User]
      summary: Get privacy preferences
      operationId: getUserPrivacy
      responses:
        "200":
          description: Privacy preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  privacy: { $ref: "#/components/schemas/Privacy" }
    patch:
      tags: [User]
      summary: Update privacy preferences
      operationId: patchUserPrivacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Privacy"
      responses:
        "200":
          description: Saved privacy preferences
  /api/user/export:
    get:
      tags: [User]
      summary: Export account data
      operationId: getUserExport
      responses:
        "200":
          description: Complete account export
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/user/account:
    delete:
      tags: [User]
      summary: Delete an account
      operationId: deleteUserAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 72 }
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/user/data:
    get:
      tags: [User]
      summary: Get account data
      operationId: getUserData
      responses:
        "200":
          description: Current account profile, plan, following and connection data
  /api/user/update:
    post:
      tags: [User]
      summary: Update the account profile
      operationId: postUserUpdate
      description: Update profile fields. Legacy multipart profile/cover uploads remain supported; direct media uploads are preferred.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                full_name: { type: string, maxLength: 100 }
                username: { type: string, minLength: 3, maxLength: 30 }
                bio: { type: string, maxLength: 500 }
                location: { type: string, maxLength: 120 }
                profile: { type: string, format: binary }
                cover: { type: string, format: binary }
      responses:
        "200":
          description: Updated user
  /api/user/discover:
    post:
      tags: [User]
      summary: Discover user profiles
      operationId: postUserDiscover
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                input: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Privacy-filtered user discovery page
  /api/user/follow:
    post:
      tags: [User]
      summary: Follow a user
      operationId: postUserFollow
      requestBody:
        $ref: "#/components/requestBodies/UserTarget"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/user/unfollow:
    post:
      tags: [User]
      summary: Unfollow a user
      operationId: postUserUnfollow
      requestBody:
        $ref: "#/components/requestBodies/UserTarget"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/user/connect:
    post:
      tags: [User]
      summary: Request a connection
      operationId: postUserConnect
      requestBody:
        $ref: "#/components/requestBodies/UserTarget"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/user/accept:
    post:
      tags: [User]
      summary: Accept a connection
      operationId: postUserAccept
      requestBody:
        $ref: "#/components/requestBodies/UserTarget"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/user/connections:
    get:
      tags: [User]
      summary: List connections
      operationId: getUserConnections
      parameters:
        - in: query
          name: section
          schema:
            enum: [connections, followers, following, pendingConnections]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Connections and pending requests
    delete:
      tags: [User]
      summary: Remove an accepted connection
      operationId: deleteUserConnection
      requestBody:
        $ref: "#/components/requestBodies/UserTarget"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/user/profiles:
    post:
      tags: [User]
      summary: Get a user profile
      operationId: postUserProfiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId: { type: string }
      responses:
        "200":
          description: Privacy-filtered profile and visible posts
  /api/user/suggested:
    get:
      tags: [User]
      summary: List suggested profiles
      operationId: getUserSuggested
      responses:
        "200":
          description: Suggested public profiles
  /api/user/recent-messages:
    get:
      tags: [Messages]
      summary: List recent conversations
      operationId: getUserRecentMessages
      responses:
        "200":
          description: Bounded recent conversations
  /api/media/presign:
    post:
      tags: [Media]
      summary: Authorize a direct media upload
      operationId: postMediaPresign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, fileName, contentType, size]
              properties:
                purpose:
                  enum: [profiles, covers, posts, stories, messages]
                fileName: { type: string, maxLength: 255 }
                contentType: { type: string }
                size: { type: integer, minimum: 1, maximum: 20971520 }
      responses:
        "201":
          description: Five-minute S3 PUT authorization
          content:
            application/json:
              schema:
                type: object
                required: [success, key, uploadUrl, expiresIn, headers]
                properties:
                  success: { const: true }
                  key: { type: string }
                  uploadUrl: { type: string, format: uri }
                  expiresIn: { type: integer }
                  headers:
                    type: object
                    additionalProperties: { type: string }
  /api/post/feed:
    get:
      tags: [Social]
      summary: Get the social feed
      operationId: getPostFeed
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: mode
          schema: { enum: [discover, following], default: discover }
      responses:
        "200":
          description: Cursor-paginated feed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      posts:
                        type: array
                        items: { $ref: "#/components/schemas/Post" }
  /api/post/add:
    post:
      tags: [Social]
      summary: Create a post
      operationId: postPostAdd
      description: Direct-upload clients pass uploadedKeys obtained from /api/media/presign.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, maxLength: 5000 }
                post_type:
                  enum: [text, image, text_with_image, video, workout]
                visibility: { enum: [public, followers, private] }
                workout: { type: string }
                uploadedKeys:
                  type: array
                  maxItems: 4
                  items: { type: string }
      responses:
        "200":
          description: Created post
  /api/post/like:
    post:
      tags: [Social]
      summary: Toggle a post like
      operationId: postPostLike
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postId]
              properties:
                postId: { type: string }
      responses:
        "200":
          description: Authoritative like state and aggregate count
          content:
            application/json:
              schema:
                type: object
                required: [success, liked, like_count]
                properties:
                  success: { const: true }
                  liked: { type: boolean }
                  like_count: { type: integer, minimum: 0 }
  /api/post/comment/add:
    post:
      tags: [Social]
      summary: Add a post comment
      operationId: postPostCommentAdd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postId, content]
              properties:
                postId: { type: string }
                content: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Created comment and aggregate count
  /api/post/{postId}/comments:
    get:
      tags: [Social]
      summary: List post comments
      operationId: getPostByPostIdComments
      parameters:
        - in: path
          name: postId
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated comments, newest first
  /api/post/delete:
    post:
      tags: [Social]
      summary: Delete a post using the legacy endpoint
      operationId: postPostDelete
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [postId]
              properties:
                postId: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/post/{postId}:
    delete:
      tags: [Social]
      summary: Delete a post
      operationId: deletePostByPostId
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/story/create:
    post:
      tags: [Social]
      summary: Create a story
      operationId: postStoryCreate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content: { type: string, maxLength: 2000 }
                media_type: { enum: [text, image, video] }
                visibility: { enum: [public, followers, private] }
                media: { type: string, format: binary }
                uploadedKey: { type: string }
      responses:
        "201":
          description: Story created
  /api/story/get:
    get:
      tags: [Social]
      summary: List visible stories
      operationId: getStoryGet
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Unexpired stories visible to the current user
  /api/story/delete/{storyId}:
    delete:
      tags: [Social]
      summary: Delete a story
      operationId: deleteStoryDeleteByStoryId
      parameters:
        - in: path
          name: storyId
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/workout:
    get:
      tags: [Workouts]
      summary: List workouts
      operationId: getWorkout
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated workouts
    post:
      tags: [Workouts]
      summary: Log a workout
      operationId: postWorkout
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutInput"
      responses:
        "201":
          description: Logged workout
        "403":
          description: Usage quota reached
  /api/workout/stats:
    get:
      tags: [Workouts]
      summary: Get workout statistics
      operationId: getWorkoutStats
      parameters:
        - in: query
          name: period
          schema: { enum: [week, month, calendar_month, year], default: month }
      responses:
        "200":
          description: Statistics filtered to the requested 7, 30, or 365-day window
  /api/message/get:
    post:
      tags: [Messages]
      summary: Get a conversation
      operationId: postMessageGet
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_user_id]
              properties:
                to_user_id: { type: string }
      responses:
        "200":
          description: Cursor-paginated conversation
  /api/message/send:
    post:
      tags: [Messages]
      summary: Send a message
      operationId: postMessageSend
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [to_user_id]
              properties:
                to_user_id: { type: string }
                text: { type: string, maxLength: 2000 }
                image: { type: string, format: binary }
                uploadedKey: { type: string }
      responses:
        "201":
          description: Message created
  /api/message/conversations:
    get:
      tags: [Messages]
      summary: List conversations
      operationId: getMessageConversations
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor-paginated conversations
  /api/message/recent:
    get:
      tags: [Messages]
      summary: List recent messages
      operationId: getMessageRecent
      responses:
        "200":
          description: Bounded recent conversations
  /api/message/seen:
    post:
      tags: [Messages]
      summary: Mark messages as seen
      operationId: postMessageSeen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_user_id]
              properties:
                from_user_id: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/message/delete/{messageId}:
    delete:
      tags: [Messages]
      summary: Delete a message
      operationId: deleteMessageDeleteByMessageId
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/exercise:
    get:
      tags: [Exercises]
      summary: Search exercises
      operationId: getExercise
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: muscle
          schema: { type: string }
        - in: query
          name: equipment
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Searchable exercise page
    post:
      tags: [Exercises]
      summary: Create a custom exercise
      operationId: postExercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, muscleGroup, equipment]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                muscleGroup: { type: string }
                equipment: { type: string }
                gifUrl: { type: string, format: uri }
      responses:
        "201":
          description: Custom exercise created
  /api/exercise/records:
    get:
      tags: [Exercises]
      summary: List personal records
      operationId: getExerciseRecords
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Personal records derived from completed workout sets
  /api/exercise/{exerciseId}:
    get:
      tags: [Exercises]
      summary: Get exercise details
      operationId: getExerciseByExerciseId
      parameters:
        - $ref: "#/components/parameters/ExerciseId"
      responses:
        "200":
          description: Exercise details
  /api/exercise/{exerciseId}/stats:
    get:
      tags: [Exercises]
      summary: Get exercise statistics
      operationId: getExerciseByExerciseIdStats
      parameters:
        - $ref: "#/components/parameters/ExerciseId"
      responses:
        "200":
          description: Current user's exercise history aggregates
  /api/routine:
    get:
      tags: [Routines]
      summary: List routines
      operationId: getRoutine
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Current user's routines
    post:
      tags: [Routines]
      summary: Create a routine
      operationId: postRoutine
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineInput"
      responses:
        "201":
          description: Routine created
  /api/routine/{routineId}:
    put:
      tags: [Routines]
      summary: Update a routine
      operationId: putRoutineByRoutineId
      parameters:
        - $ref: "#/components/parameters/RoutineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineInput"
      responses:
        "200":
          description: Routine updated
    delete:
      tags: [Routines]
      summary: Delete a routine
      operationId: deleteRoutineByRoutineId
      parameters:
        - $ref: "#/components/parameters/RoutineId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/muscle-groups:
    get:
      tags: [Reference]
      summary: List muscle groups
      operationId: getMuscleGroups
      responses:
        "200":
          description: Canonical muscle-group reference data
  /api/equipment:
    get:
      tags: [Reference]
      summary: List equipment
      operationId: getEquipment
      responses:
        "200":
          description: Canonical equipment reference data
  /api/admin/users:
    get:
      tags: [Admin]
      summary: List users for administration
      operationId: getAdminUsers
      responses:
        "200":
          description: Superadmin-only user administration page
  /api/admin/users/{userId}/role:
    put:
      tags: [Admin]
      summary: Update a user role
      operationId: putAdminUsersByUserIdRole
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /health/live:
    get:
      tags: [Health]
      summary: Check API liveness
      operationId: getHealthLive
      security: []
      responses:
        "200":
          description: Process liveness
  /health/ready:
    get:
      tags: [Health]
      summary: Check API readiness
      operationId: getHealthReady
      security: []
      responses:
        "200":
          description: Database, Redis and capability readiness
        "503":
          description: A required dependency is unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Stable client-generated key reused when retrying the same create operation.
      schema: { type: string, minLength: 8, maxLength: 128 }
    Cursor:
      in: query
      name: cursor
      schema: { type: string, maxLength: 512 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100 }
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string }
    PostId:
      in: path
      name: postId
      required: true
      schema: { type: string }
    ExerciseId:
      in: path
      name: exerciseId
      required: true
      schema: { type: string }
    RoutineId:
      in: path
      name: routineId
      required: true
      schema: { type: string }
  requestBodies:
    UserTarget:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id: { type: string }
  schemas:
    RegisterRequest:
      type: object
      required: [email, username, full_name, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-z0-9._-]+$"
        full_name: { type: string, minLength: 2, maxLength: 100 }
        password: { type: string, minLength: 10, maxLength: 72 }
    Privacy:
      type: object
      properties:
        publicProfile: { type: boolean }
        showWorkoutsOnFeed: { type: boolean }
        allowFollowers: { type: boolean }
        showInSearch: { type: boolean }
        allowMessages: { type: boolean }
      additionalProperties: false
    User:
      type: object
      required: [id, email, username, full_name]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        username: { type: string }
        full_name: { type: string }
        profile_picture: { type: string }
        bio: { type: string }
        privacy: { $ref: "#/components/schemas/Privacy" }
    AuthResponse:
      type: object
      required: [success, user, token, accessTokenExpiresAt]
      properties:
        success: { const: true }
        user: { $ref: "#/components/schemas/User" }
        token: { type: string }
        accessTokenExpiresAt: { type: integer }
        refreshToken:
          type: string
          description: "Returned only to clients declaring X-Client-Platform: mobile."
    WorkoutSetInput:
      type: object
      required: [reps, weight]
      properties:
        reps: { type: integer, minimum: 0, maximum: 10000 }
        weight: { type: number, minimum: 0, maximum: 100000 }
        completed: { type: boolean, default: true }
        setType: { enum: [normal, warmup, drop, failure] }
    WorkoutInput:
      type: object
      required: [name, startTime, endTime, exercises]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        notes: { type: string, maxLength: 2000 }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        visibility: { enum: [public, followers, private] }
        exercises:
          type: array
          minItems: 1
          items:
            type: object
            required: [exerciseId, sets]
            properties:
              exerciseId: { type: string }
              sets:
                type: array
                minItems: 1
                items: { $ref: "#/components/schemas/WorkoutSetInput" }
      description: Aggregate duration, volume, set and rep totals are server-derived and ignored when supplied by clients.
    RoutineInput:
      type: object
      required: [name, exercises]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        exercises:
          type: array
          minItems: 1
          items:
            type: object
            required: [exerciseId, sets]
            properties:
              exerciseId: { type: string }
              sets:
                type: array
                minItems: 1
                items: { $ref: "#/components/schemas/WorkoutSetInput" }
    Post:
      type: object
      required: [_id, user, like_count, liked_by_me, comment_count, comments]
      properties:
        _id: { type: string }
        user: { $ref: "#/components/schemas/User" }
        content: { type: string }
        like_count: { type: integer, minimum: 0 }
        liked_by_me: { type: boolean }
        comment_count: { type: integer, minimum: 0 }
        comment_next_cursor: { type: [string, "null"] }
        comments:
          type: array
          description: Bounded latest-comment preview. Use the comments endpoint for history.
          maxItems: 20
          items: { type: object, additionalProperties: true }
      additionalProperties: true
    Page:
      type: object
      required: [success]
      properties:
        success: { const: true }
        nextCursor:
          type: [string, "null"]
  responses:
    Success:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { const: true }
    BadRequest:
      description: Invalid request
    Unauthorized:
      description: Authentication failed
    Conflict:
      description: Resource conflict
    RateLimited:
      description: Rate limit exceeded
