# Cache policy is decided here rather than in a location block on purpose: an
# `add_header` inside a location replaces every `add_header` inherited from the
# server, which would silently drop the CSP and the other security headers for
# whatever that location serves.
map $uri $motionmeet_document_cache_control {
    default "";
    "/" "no-store";
    "/index.html" "no-store";
    # Vite puts a content hash in every filename under /assets, so a file at a
    # given URL never changes. `immutable` is what stops the browser
    # revalidating them on every reload.
    "~^/assets/" "public, max-age=31536000, immutable";
}

# The API, resolved through Docker's DNS while nginx runs (`resolve`, nginx
# 1.27.3+) rather than once at startup: after a backend redeploy the new
# container has a new address, and a name pinned at startup answered 502
# until this container was restarted too. Every address the name returns is
# used, round robin, so `--scale backend=N` needs nothing else here.
#
# Kept-alive connections to it. Proxying through a variable (the previous way
# to re-resolve) opened a new TCP connection for every request: a handshake
# per API call and, under load, thousands of sockets in TIME_WAIT. A
# connection that fails is skipped for that request (proxy_next_upstream's
# default "error timeout", which never retries a POST).
upstream motionmeet_backend {
    zone motionmeet_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server backend:4000 resolve;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

# Upgrade only what asks to be upgraded; every other request keeps its
# upstream connection alive (an empty Connection header).
map $http_upgrade $motionmeet_connection {
    default upgrade;
    "" "";
}

# The client's request id when it sent a sane one (the mobile app sends its
# operation's id), otherwise nginx's own; logged here and passed to the API,
# which logs it on every line of that request.
map $http_x_request_id $motionmeet_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id;
}

log_format motionmeet_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request_id":"$motionmeet_request_id","method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"upstream":"$upstream_addr","user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    autoindex off;
    client_max_body_size 25m;

    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Runtime;
    proxy_hide_header X-Application-Version;
    proxy_hide_header X-Build-Number;
    proxy_hide_header X-Environment;
    proxy_hide_header X-Debug;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nearby asks for the device position; only this origin may, never a frame.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $motionmeet_document_cache_control always;

    root /usr/share/nginx/html;
    index index.html;

    # The query string is left out on purpose (`$uri`, not `$request_uri`):
    # share links and signed media parameters do not belong in access logs.
    access_log /var/log/nginx/access.log motionmeet_json;

    # Optional: the addresses of a TLS proxy or load balancer in front of this
    # container, so `$remote_addr` (logs) is the client's. Mount a file such as
    #   set_real_ip_from 10.0.0.0/8; real_ip_header X-Forwarded-For; real_ip_recursive on;
    # at /etc/nginx/motionmeet/real-ip.conf (docs/operations/DEPLOYMENT.md). The
    # API decides the client address from X-Forwarded-For itself (TRUST_PROXY).
    include /etc/nginx/motionmeet/real-ip*.conf;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    # nginx does not compress a proxied response unless told to, and every API
    # response here is proxied - so the feed, conversation and Keşfet payloads,
    # the most compressible traffic in the product, were going out raw while
    # only the static bundle was being gzipped.
    gzip_proxied any;
    # Below about a kilobyte the framing costs more than the compression saves.
    gzip_min_length 1024;
    # Level 5 is where the JSON curve flattens; higher settings spend
    # noticeably more CPU for very little further reduction.
    gzip_comp_level 5;
    gzip_vary on;

    location = /api/user/export {
        proxy_pass http://motionmeet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $motionmeet_request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 15m;
    }

    location /api/ {
        proxy_pass http://motionmeet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $motionmeet_request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness is for the orchestrator, which reads it on the private ops port
    # (9464) or inside the container. Publicly it only told anyone which
    # capabilities and dependencies were up.
    location = /health/ready {
        return 404;
    }

    location /health/ {
        proxy_pass http://motionmeet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $motionmeet_request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://motionmeet_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $motionmeet_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html { }

    location /assets/ {
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
