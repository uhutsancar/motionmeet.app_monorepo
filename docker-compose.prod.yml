name: motionmeet_prod

# Production intentionally does not bundle single-node MongoDB or Redis.
# .env.production must point at authenticated, backed-up, highly available
# managed services.
services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.prod
    env_file:
      - path: ${MOTIONMEET_ENV_FILE:-.env.production}
        required: true
    environment:
      NODE_ENV: production
      PORT: 4000
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.prod
      args:
        VITE_BASEURL: ""
        VITE_SOCKET_URL: ""
        VITE_BUILD_SOURCEMAP: "false"
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge

networks:
  edge:
