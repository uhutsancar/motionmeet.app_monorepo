name: motionmeet_prod

# Production intentionally does not bundle PostgreSQL, Redis or RabbitMQ.
# .env.production must point at authenticated, backed-up, highly available
# managed services (RabbitMQ only when OUTBOX_TRANSPORT=rabbitmq).
#
# One backend image runs as four processes (docs/operations/DEPLOYMENT.md):
#   migrate    one-shot schema migration, before anything else starts
#   backend    HTTP API + Socket.IO; no background work
#   worker     outbox relay and event consumers
#   scheduler  recurring housekeeping (advisory-locked, safe to overlap)
x-backend-image: &backend-image
  build:
    context: .
    dockerfile: packages/backend/Dockerfile.prod
    # Explicit: the Dockerfile's last stage is the FFmpeg-carrying worker image.
    target: runtime
  image: motionmeet-backend:${MOTIONMEET_IMAGE_TAG:-local}
  env_file:
    - path: ${MOTIONMEET_ENV_FILE:-.env.production}
      required: true
  # No `init: true`: the image's entrypoint is tini, which is PID 1 and reaps
  # and forwards signals itself; a second init in front of it only warns.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - edge

x-ops-healthcheck: &ops-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9464/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
  interval: 20s
  timeout: 5s
  retries: 6
  start_period: 30s

services:
  migrate:
    <<: *backend-image
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      NODE_ENV: production
    restart: "no"

  backend:
    <<: *backend-image
    environment:
      NODE_ENV: production
      PORT: 4000
      MOTIONMEET_PROCESS_ROLE: api
      # Schema changes and background work run in their own processes.
      RUN_MIGRATIONS: "false"
      RUN_SCHEDULED_JOBS: "false"
      METRICS_PORT: 9464
      # The heap stays inside the container's limit with room for the worker
      # threads, sharp and socket buffers, so V8 collects before the kernel
      # kills; without it V8 sizes the heap from the host's memory.
      NODE_OPTIONS: --max-old-space-size=640
      # One of the two CPUs hashes passwords, the other stays with the event
      # loop (utils/passwordHashing.ts). Raise both together.
      PASSWORD_HASH_WORKERS: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    # The API closes sockets, drains requests and stops within 10 s
    # (server.ts); the margin keeps Docker from killing it half-way.
    stop_grace_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  worker:
    <<: *backend-image
    # Same code as the API, plus FFmpeg for measuring videos (Dockerfile target).
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.prod
      target: media-runtime
    image: motionmeet-backend-media:${MOTIONMEET_IMAGE_TAG:-local}
    command: ["node", "dist/entrypoints/worker.js"]
    environment:
      NODE_ENV: production
      MOTIONMEET_PROCESS_ROLE: worker
      METRICS_PORT: 9464
      DATABASE_POOL_MAX: 10
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck: *ops-healthcheck
    # Long enough for in-flight events to finish and acknowledge (runtime/lifecycle.ts).
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  scheduler:
    <<: *backend-image
    command: ["node", "dist/entrypoints/scheduler.js"]
    environment:
      NODE_ENV: production
      MOTIONMEET_PROCESS_ROLE: scheduler
      METRICS_PORT: 9464
      DATABASE_POOL_MAX: 5
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck: *ops-healthcheck
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.prod
      args:
        VITE_BASEURL: ""
        VITE_SOCKET_URL: ""
        VITE_BUILD_SOURCEMAP: "false"
    ports:
      - "${HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge

networks:
  edge:
