name: motionmeet_prod

services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.prod
    expose:
      - "4000"
    env_file:
      - path: ./.env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - motionmeet_prod_net

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.prod
      args:
        VITE_BASEURL: ${VITE_BASEURL:-}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - motionmeet_prod_net

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - motionmeet_prod_net

networks:
  motionmeet_prod_net:
    driver: bridge

volumes:
  redis_data:
